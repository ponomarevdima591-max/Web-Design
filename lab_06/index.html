<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анімований годинник</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <div class="clock" role="img" aria-label="Годинник з анімованою годинниковою та хвилинною стрілками">
            <span class="hand hour-hand" aria-hidden="true"></span>
            <span class="hand minute-hand" aria-hidden="true"></span>
            <span class="clock-center" aria-hidden="true"></span>
        </div>
    </main>
</body>
</html>
