<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мережевий адаптер TP-Link TG-3468</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <article class="adapter-card">
            <img class="adapter-photo" src="adapter.jpg"
                alt="Мережева карта TP-Link TG-3468 з роз’ємом RJ45" width="208" height="208">
            <h1 class="adapter-model">TP-Link TG-3468</h1>
            <dl class="adapter-specs">
                <dt class="spec-label">Тип</dt>
                <dd class="spec-value">Мережева карта GbE</dd>
                <dt class="spec-label">Інтерфейс</dt>
                <dd class="spec-value">PCI Express</dd>
                <dt class="spec-label">Максимальна швидкість</dt>
                <dd class="spec-value">1000 Мбіт/с</dd>
                <dt class="spec-label">Розміри</dt>
                <dd class="spec-value">78,5 × 120,8 × 21,5 мм</dd>
            </dl>
            <div class="adapter-actions" lang="en">
                <button class="edit-button" type="button">Edit</button>
                <button class="delete-button" type="button">Delete</button>
            </div>
        </article>
    </main>
</body>
</html>
